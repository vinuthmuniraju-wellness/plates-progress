/* Layout: a kitchen-notebook tool — sticky header with profile switcher, tab strip, one working column of meal cards. Veg/non-veg use the Indian food-label marks. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --sunk:#e8eee9; --ink:#16211a; --muted:#5a6a60; --line:#d6dfd8;
  --accent:#1d6b47; --accent-soft:#dcefe4; --on-accent:#ffffff;
  --veg:#17863a; --nonveg:#8a3a1c; --warn:#a86a12; --bad:#b4281f; --good:#1d6b47;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1310; --surface:#161d18; --sunk:#1d2620; --ink:#e6ece7; --muted:#9aa9a0; --line:#2a352e;
  --accent:#56c08a; --accent-soft:#1c3327; --on-accent:#08130d;
  --veg:#4cc46f; --nonveg:#df7f55; --warn:#e0a443; --bad:#f07065; --good:#56c08a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1310; --surface:#161d18; --sunk:#1d2620; --ink:#e6ece7; --muted:#9aa9a0; --line:#2a352e;
  --accent:#56c08a; --accent-soft:#1c3327; --on-accent:#08130d;
  --veg:#4cc46f; --nonveg:#df7f55; --warn:#e0a443; --bad:#f07065; --good:#56c08a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.brand .plate{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center}
.brand .plate i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.store-badge{font-size:.75rem;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 .92rem var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px;display:grid;gap:18px}

button,.btn{font:600 .88rem var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--ink)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
.field{display:grid;gap:4px}
.field span{font-size:.8rem;font-weight:600;color:var(--muted)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel.flat{background:transparent;border:0;padding:0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px;min-width:0}
.tile .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--accent-soft);color:var(--good)}
.pill.warn{color:var(--warn)}
.pill.bad{color:var(--bad)}

/* Indian food-label marks */
.mark{width:15px;height:15px;border:1.5px solid currentColor;display:inline-grid;place-items:center;border-radius:2px;flex:none}
.mark.veg{color:var(--veg)} .mark.veg::after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.mark.nonveg{color:var(--nonveg)} .mark.nonveg::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid currentColor}

.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over i{background:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.macro{display:grid;gap:4px}
.macro .bar{height:6px}

.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar input[type=date]{width:auto}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal-head{display:flex;align-items:baseline;gap:10px;padding:14px 16px 8px;flex-wrap:wrap}
.meal-head .tgt{margin-left:auto}
.yday{padding:0 16px 8px;font-size:.84rem;color:var(--muted)}
.entries{list-style:none;margin:0;padding:0 16px;display:grid}
.entries li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.entries li .nm{flex:1;min-width:0}
.entries li .nm b{font-weight:600}
.empty{padding:6px 16px 12px;color:var(--muted);font-size:.9rem}
.meal-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--sunk);border-top:1px solid var(--line);align-items:center}

.recipe-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.col-head{display:flex;align-items:center;gap:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.rcard h3{display:flex;gap:8px;align-items:flex-start}
.rcard h3 .mark{margin-top:3px}
.rmeta{display:flex;gap:6px;flex-wrap:wrap}
.rcard details summary{cursor:pointer;font-size:.85rem;font-weight:600;color:var(--accent)}
.rcard ol,.rcard ul{margin:6px 0 0;padding-left:20px;font-size:.88rem}
.rcard .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rcard .act select{width:auto}
.ai-tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.sheet{background:var(--surface);border-radius:14px;max-width:520px;width:100%;padding:20px;display:grid;gap:14px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.copybox{font-family:var(--f-mono);font-size:.82rem;white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px;border:1px solid var(--line);width:100%;min-height:180px}
.upload{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:8px;padding:12px}
.upload>div:first-child{flex:1;min-width:200px}
.upload #reportStatus,.upload #planStatus{flex-basis:100%}
.upload.drag{border-color:var(--accent);background:var(--accent-soft)}
input.filled,select.filled{border-color:var(--accent);background:var(--accent-soft)}
td.wrapcell{white-space:normal;min-width:220px;font-size:.85rem}
.review td{white-space:normal}
.review input{width:84px;padding:6px 8px}
.review textarea{min-width:200px;min-height:56px;font-size:.85rem}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kin{width:96px;text-align:right;padding:6px 8px}
.kin.day{font-weight:700}
.meal-recipes{display:grid;gap:10px}
.meal-recipes+.meal-recipes{border-top:1px dashed var(--line);padding-top:14px}
[hidden]{display:none!important}
.lookup{display:grid;gap:8px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.pill-btn{border:0;cursor:pointer;font:inherit;font-size:.75rem;font-weight:600}
.gate{display:flex;gap:12px;align-items:flex-start;background:var(--sunk);border-radius:8px;padding:12px}
.g-logo{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 1rem var(--f-display);color:var(--accent);background:var(--surface);border:1px solid var(--line)}
.gate-error{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:12px;display:grid;gap:4px}
.gate-error div{color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);text-decoration:none}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.hero-empty{display:grid;gap:10px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hero-empty h2{font-size:1.7rem}
.note{font-size:.84rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
/* ---------- Theme layer: colour themes, depth, motion ---------- */
:root{ --shadow:0 1px 2px rgb(16 24 20 / .06), 0 8px 24px -12px rgb(16 24 20 / .18); --r:14px; --glow:var(--accent) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px -14px rgb(0 0 0 / .7) }}
:root[data-theme="dark"]{ --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px -14px rgb(0 0 0 / .7) }
/* Saffron */
:root[data-accent="saffron"]{ --accent:#b9500f; --accent-soft:#fde8d6; --on-accent:#ffffff }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"])[data-accent="saffron"]{ --accent:#ff9b52; --accent-soft:#3b2414; --on-accent:#1c0d03 }}
:root[data-theme="dark"][data-accent="saffron"]{ --accent:#ff9b52; --accent-soft:#3b2414; --on-accent:#1c0d03 }
/* Ocean */
:root[data-accent="ocean"]{ --accent:#0d6b8c; --accent-soft:#d8edf4; --on-accent:#ffffff }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"])[data-accent="ocean"]{ --accent:#52c6ea; --accent-soft:#11303b; --on-accent:#03161d }}
:root[data-theme="dark"][data-accent="ocean"]{ --accent:#52c6ea; --accent-soft:#11303b; --on-accent:#03161d }
/* Berry */
:root[data-accent="berry"]{ --accent:#a3245c; --accent-soft:#f8dde8; --on-accent:#ffffff }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"])[data-accent="berry"]{ --accent:#f07aa9; --accent-soft:#3a1626; --on-accent:#22060f }}
:root[data-theme="dark"][data-accent="berry"]{ --accent:#f07aa9; --accent-soft:#3a1626; --on-accent:#22060f }

body{background:
  radial-gradient(900px 420px at 100% -80px, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%),
  radial-gradient(700px 380px at -10% 30%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%),
  var(--bg); background-attachment:fixed}
header.top{background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.brand .plate{background:conic-gradient(var(--accent) 0 70%, var(--accent-soft) 70% 100%);border:0;position:relative}
.brand .plate::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.brand .plate i{position:relative;z-index:1;width:8px;height:8px}
nav.tabs{gap:6px;padding-bottom:10px}
nav.tabs button{border:0;border-radius:999px;padding:7px 14px}
nav.tabs button:hover{background:var(--sunk);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.swatches{display:flex;gap:6px;align-items:center}
.swatch{width:20px;height:20px;border-radius:50%;padding:0;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swatch.fresh{background:#2f8f5f}.swatch.saffron{background:#e0711f}.swatch.ocean{background:#1b8db5}.swatch.berry{background:#c23b78}

.panel,.meal,.tile,.rcard,.hero-empty{box-shadow:var(--shadow);border-radius:var(--r)}
.meal{overflow:hidden}
.meal-head h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle;background:var(--mc,var(--accent))}
.meal[data-meal="breakfast"]{--mc:#e8a23a}.meal[data-meal="lunch"]{--mc:#3fa36b}.meal[data-meal="snack"]{--mc:#8b6cd6}.meal[data-meal="dinner"]{--mc:#3b82c4}
button,.btn{transition:transform .12s ease, box-shadow .12s ease, background .12s ease}
button.primary:hover,.btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px var(--accent)}
.rcard{transition:transform .15s ease, box-shadow .15s ease}
.rcard:hover{transform:translateY(-2px)}

/* Today hero */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:20px;display:grid;gap:16px;grid-template-columns:auto 1fr;align-items:center;
  background:radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 60%), var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.hero .greet{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1.1}
.hero .quote{font-size:.95rem;color:var(--muted);max-width:52ch}
.hero .quote b{color:var(--ink);font-weight:600}
.hero .hero-text{display:grid;gap:8px;min-width:0}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--off)}
.ring.over .fg{stroke:var(--warn)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .mid b{font-family:var(--f-display);font-size:1.5rem;font-weight:800}
.ring .mid span{font-size:.72rem;color:var(--muted)}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:start}.ring{width:116px;height:116px}}

/* Coach */
.coach{position:relative;border-radius:18px;padding:18px;display:grid;gap:12px;border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface) 65%);box-shadow:var(--shadow)}
.coach h2{font-size:1.45rem}
.coach p{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;justify-self:start}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start}
.pick b{display:flex;gap:8px;align-items:flex-start;font-weight:600}
.pick b .mark{margin-top:3px}
.boost{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem;background:var(--sunk);border-radius:10px;padding:10px 12px}
.goalbar{display:flex;gap:6px;flex-wrap:wrap}

/* Goal box */
.goal-box{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, var(--surface)), var(--surface) 70%)}
.goal-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.goal-row>div:first-child{flex:1;min-width:220px}
.goal-input{width:150px;font-family:var(--f-display);font-size:1.6rem;font-weight:800;padding:6px 12px;text-align:right}

/* Motion: only on a fresh view, never on every re-render */
.anim .ring .fg{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.anim .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.anim .rise:nth-child(2){animation-delay:.07s}.anim .rise:nth-child(3){animation-delay:.14s}.anim .rise:nth-child(4){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.anim .pick{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.anim .pick:nth-child(2){animation-delay:.1s}.anim .pick:nth-child(3){animation-delay:.2s}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
.chip.pulse i{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent)}50%{box-shadow:0 0 0 6px transparent}}
.anim .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

.etime{font-size:.75rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 6px;white-space:nowrap}
.hydro-grid{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hydro-body{display:grid;gap:10px;min-width:0}
.glass{position:relative;width:86px;height:118px;border:3px solid color-mix(in srgb, #3aa0d8 55%, var(--line));border-top-width:2px;border-radius:6px 6px 18px 18px;overflow:hidden;background:var(--sunk)}
.glass .fill{position:absolute;left:0;right:0;bottom:0;height:var(--lvl);background:linear-gradient(180deg,#5ec0ee,#2b8fd0);transition:height .7s cubic-bezier(.2,.8,.2,1)}
.glass .wave{position:absolute;left:-50%;top:-7px;width:200%;height:14px;background:radial-gradient(12px 8px at 12px 8px,#5ec0ee 98%,transparent) 0 0/24px 14px repeat-x;animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(24px)}}
.anim .glass .fill{animation:fillUp 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes fillUp{from{height:0}}
.glass-text{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1;color:var(--ink)}
.glass-text b{font-family:var(--f-display);font-size:1.35rem;font-weight:800}
.glass-text span{font-size:.7rem;color:var(--muted)}
.glass.full{border-color:#2b8fd0}
.coffee-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.nudge{color:var(--warn);font-weight:600}
@media (max-width:520px){.hydro-grid{grid-template-columns:1fr;justify-items:start}}
body.locked .nav{display:none}
body.locked .shell{grid-template-columns:minmax(0,1fr)}
.lock{width:100%}
.lock{max-width:520px;margin:40px auto;text-align:center;display:grid;gap:12px;justify-items:center;padding:32px 24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.lock h2{font-size:1.5rem}
.lock p{margin:0;max-width:44ch}
/* ---------- Cartoon layer: floating gym background, mascot, meal icons ---------- */
.bg-art{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;color:color-mix(in srgb, var(--accent) 70%, var(--ink))}
.bg-art svg{position:absolute;height:auto;aspect-ratio:1;opacity:.19;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.bg-art .f1{animation:drift1 14s ease-in-out infinite}
.bg-art .f2{animation:drift2 17s ease-in-out infinite}
.bg-art .f3{animation:drift3 20s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-16px) rotate(6deg)}}
@keyframes drift2{0%,100%{transform:translate(0,0) rotate(10deg)}50%{transform:translate(10px,14px) rotate(-6deg)}}
@keyframes drift3{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(12px) rotate(-12deg)}}
@media (max-width:760px){.bg-art .wide{display:none}.bg-art svg{opacity:.1}}
header.top,main,#overlayRoot{position:relative;z-index:1}
header.top{z-index:5}

/* Pip, the mascot */
.mascot{width:150px;height:auto;overflow:visible;flex:none}
.mascot .body{fill:var(--accent)}
.mascot .belly{fill:color-mix(in srgb, var(--surface) 75%, var(--accent))}
.mascot .limb{stroke:var(--accent);stroke-width:9;stroke-linecap:round;fill:none}
.mascot .shoe{fill:var(--ink)}
.mascot .band{fill:#ff6b5e}
.mascot .eye{fill:#fff}
.mascot .pupil{fill:#17201b}
.mascot .cheek{fill:#ff8f8f;opacity:.55}
.mascot .mouth{fill:none;stroke:#17201b;stroke-width:3;stroke-linecap:round}
.mascot .bar{stroke:#4b5563;stroke-width:5;stroke-linecap:round}
.mascot .plate{fill:#374151}
.mascot .plate2{fill:#6b7280}
.mascot .drop{fill:#5ec0ee}
.mascot .shadow{fill:var(--ink);opacity:.12}
.mascot .lift{animation:lift 2.2s ease-in-out infinite;transform-origin:80px 70px}
@keyframes lift{0%,100%{transform:translateY(22px)}45%,60%{transform:translateY(0)}}
.mascot .whole{animation:squat 2.2s ease-in-out infinite;transform-origin:80px 160px}
@keyframes squat{0%,100%{transform:scaleY(.96)}45%,60%{transform:scaleY(1)}}
.mascot .lids{animation:blink 4.5s infinite;transform-origin:80px 92px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot .drop{animation:sweat 2.2s ease-in infinite}
@keyframes sweat{0%,40%{opacity:0;transform:translate(0,0)}55%{opacity:1}100%{opacity:0;transform:translate(6px,22px)}}
.mascot.cheer .whole{animation:hop .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mascot.cheer .lift{animation:none;transform:translateY(-6px)}
.mascot.cheer .drop{display:none}
.mascot-sm{width:46px;height:46px;flex:none}
.hero{grid-template-columns:auto 1fr auto}
.hero .pipwrap{display:grid;justify-items:center;gap:2px}
.speech{font-size:.75rem;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 10px;position:relative;white-space:nowrap}
.speech::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@media (max-width:760px){.hero{grid-template-columns:auto 1fr}.hero .pipwrap{grid-column:2;grid-row:1;justify-self:end}.mascot{width:96px}}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero .pipwrap{position:absolute;top:12px;right:10px}.mascot{width:84px}.speech{display:none}}
.coach-head{display:flex;gap:12px;align-items:center}
.coach-head .mascot-sm{animation:wave-in .8s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes wave-in{from{transform:scale(.4) rotate(-20deg);opacity:0}}

/* meal icons */
.meal-head h3::before{display:none}
.micon{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb, var(--mc) 18%, var(--surface));color:var(--mc)}
.micon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meal-head{align-items:center}
.lock .mascot{width:120px}
/* ================= Redesign layer: palette, responsive shell, modern surfaces =================
   Layout: wide screens get a sidebar and a two-column Today dashboard; tablets get top pills; phones get a bottom tab bar. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --sunk:#edf2ef; --ink:#13201a; --muted:#5b6a63; --line:#dfe6e2;
  --accent:#0f9d6b; --accent-soft:#d9f3e8; --on-accent:#ffffff;
  --accent2:#ff7a59; --accent2-soft:#ffe8e0; --sun:#f5b83d; --plum:#7a5cff; --sky:#2b9be0;
  --good:#0f8a5f; --hero1:#0b8a5e; --hero2:#0e6a8f; --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1110; --surface:#121a18; --sunk:#192320; --ink:#e8efeb; --muted:#94a39c; --line:#24302c;
  --accent:#34d399; --accent-soft:#11352a; --on-accent:#04140d;
  --accent2:#ff8e70; --accent2-soft:#3a1d15; --sun:#ffcf5c; --plum:#a08cff; --sky:#5cb8f0; --good:#34d399 }}
:root[data-theme="dark"]{
  --bg:#0b1110; --surface:#121a18; --sunk:#192320; --ink:#e8efeb; --muted:#94a39c; --line:#24302c;
  --accent:#34d399; --accent-soft:#11352a; --on-accent:#04140d;
  --accent2:#ff8e70; --accent2-soft:#3a1d15; --sun:#ffcf5c; --plum:#a08cff; --sky:#5cb8f0; --good:#34d399 }
:root[data-accent="saffron"]{--hero1:#d0560f;--hero2:#b22e57}
:root[data-accent="ocean"]{--hero1:#0a6ea3;--hero2:#4a4fc9}
:root[data-accent="berry"]{--hero1:#a51f5b;--hero2:#6a3fc6}

body{font-size:15px}
h2{font-size:1.3rem;letter-spacing:-.01em}

/* header */
header.top{border-bottom:1px solid var(--line)}
.top-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{margin-right:auto}
.brand h1{font-size:1.25rem}

/* shell + navigation */
.shell{max-width:1280px;margin:0 auto;display:grid;gap:22px;position:relative;z-index:1;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#main{padding-block:16px 64px;display:grid;gap:18px;min-width:0;align-content:start}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:16px}
.nav button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:9px 15px;font:600 .9rem var(--f-body);white-space:nowrap;box-shadow:none}
.nav button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--sunk);color:var(--ink);transform:none}
.nav button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent)}
.nav .sm{display:none}
@media (min-width:1100px){
  .shell{grid-template-columns:212px minmax(0,1fr);gap:30px}
  .nav{flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;padding-top:22px;overflow:visible;gap:4px}
  .nav button{width:100%;border-radius:12px;padding:11px 14px}
  #main{padding-top:22px}
}
@media (max-width:759px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;gap:0;overflow:visible;
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));
    background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .nav button{flex:1;min-width:0;flex-direction:column;gap:3px;font-size:.68rem;padding:5px 2px;border-radius:12px}
  .nav button svg{width:22px;height:22px;padding:3px 12px;box-sizing:content-box;border-radius:999px;transition:background .2s}
  .nav button[aria-selected="true"]{background:transparent;color:var(--accent);box-shadow:none}
  .nav button[aria-selected="true"] svg{background:var(--accent-soft)}
  .nav .lg{display:none}.nav .sm{display:inline}
  #main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  #storeBadge{display:none}
  .brand h1{font-size:1.1rem}
  .top-inner{padding-block:10px}
  .swatch{width:18px;height:18px}
}

/* surfaces */
.panel,.meal,.tile,.rcard,.hero-empty,.lock{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.panel{padding:18px}
button,.btn{border-radius:10px}
input,select,textarea{border-radius:10px}
.pill{padding:3px 10px}
.tile .big{font-size:1.75rem}
.g4 .tile:nth-child(1){border-top:3px solid var(--plum)}
.g4 .tile:nth-child(2){border-top:3px solid var(--accent)}
.g4 .tile:nth-child(3){border-top:3px solid var(--sun)}
.g4 .tile:nth-child(4){border-top:3px solid var(--accent2)}

/* day bar */
.daybar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:var(--shadow)}
.daybar input[type=date]{border:0;background:var(--sunk);font-weight:600}

/* Today dashboard */
.dash{display:grid;gap:18px}
.col-main,.col-side{display:grid;gap:18px;align-content:start;min-width:0}
@media (min-width:1100px){
  .dash{grid-template-columns:minmax(0,1fr) 340px}
  .col-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
}

.col-side .macros{grid-template-columns:1fr}
.col-side .hydro-grid{grid-template-columns:auto 1fr;gap:14px}
.col-side .glass{width:70px;height:100px}
.col-side .row h2{font-size:1.1rem}

/* hero: bold gradient card */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0;box-shadow:0 22px 40px -24px var(--hero2)}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;left:30%;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero .greet{color:#fff}
.hero .quote{color:rgba(255,255,255,.86)}
.hero .pill,.hero .pill.good,.hero .pill.warn{background:rgba(255,255,255,.17);color:#fff;backdrop-filter:blur(4px)}
.hero .ring .bg{stroke:rgba(255,255,255,.22)}
.hero .ring .fg{stroke:#fff}
.hero .ring.over .fg{stroke:var(--sun)}
.hero .ring .mid b{color:#fff}.hero .ring .mid span{color:rgba(255,255,255,.8)}
.hero .speech{background:#fff;color:#13201a;border-color:transparent}
.hero .speech::after{background:#fff;border-color:transparent}
.mascot .body{fill:var(--sun)}
.mascot .belly{fill:#fff3d1}
.mascot .limb{stroke:var(--sun)}
.mascot .shadow{fill:#000;opacity:.16}

/* coach: coral accent */
.coach{background:linear-gradient(135deg,var(--accent2-soft),var(--surface) 62%);border:1px solid var(--line)}
.coach .chip{background:var(--accent2);color:#fff}
.coach .chip i{background:#fff}
.pick{border-radius:14px;transition:transform .15s ease, box-shadow .15s ease}
.pick:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

/* meals */
.meal-head h3{font-size:1.08rem}
.meal-foot{background:var(--sunk)}
.entries li .acts{display:flex;gap:2px}
.entries li .nm{cursor:pointer}
.entries li .nm:hover b{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.wchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;color:var(--ink)}
.wchip:hover{border-color:var(--sky)}

/* recipes */
.rcard{border-radius:16px}
.recipe-cols{gap:18px}

/* phones */
@media (max-width:520px){
  .panel{padding:14px}
  .meal-head{padding:12px 14px 6px}
  .entries{padding:0 14px}
  .meal-foot{padding:10px 14px}
  .meal-foot .spacer{display:none}
  .hero{padding:18px}
  .hero .greet{font-size:1.35rem}
  .tile .big{font-size:1.45rem}
  .goal-input{width:120px;font-size:1.35rem}
  .daybar{gap:4px}
  .daybar .spacer{display:none}
}
/* below the wide layout, put macros and water between the coach and the meals */
@media (max-width:1099px){
  .dash{grid-template-columns:minmax(0,1fr)}
  .col-main,.col-side{display:contents}
  .dash .hero{order:1}.dash .coach{order:2}.col-side>*{order:3}.dash .meal{order:4}
}
@media (min-width:760px) and (max-width:1099px){
  .dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .dash .hero,.dash .coach,.dash .meal{grid-column:1 / -1}
  .col-side>*{grid-column:auto}
}
.hydro-grid{align-items:start}
@media (max-width:520px){ .g4{grid-template-columns:1fr 1fr;gap:10px} .tile{padding:12px} .tile .small{font-size:.78rem} }
.wa-badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#25d366;color:#fff;flex:none}
.wa-btn{background:#25d366;border-color:#25d366;color:#fff}
.wa-btn:hover{border-color:#1ebe5a;background:#1ebe5a}
.wa-out svg{color:#1faa52}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;justify-self:start}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.copybox{min-height:260px;font-family:var(--f-body);font-size:.9rem;line-height:1.55}
/* ---------- Workout tab ---------- */
.x-floor{stroke:var(--line);stroke-width:2;stroke-dasharray:4 5}
.x-prop{fill:color-mix(in srgb, var(--muted) 22%, var(--surface))}
.x-limb{stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.x-far{stroke:color-mix(in srgb, var(--ink) 35%, var(--surface))}
.x-spine{stroke:var(--ink);stroke-width:10;stroke-linecap:round}
.x-hl{stroke:var(--accent2)}
.x-head{fill:var(--ink)}
.x-guide{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round}
.x-iron{fill:#5b6573}
.x-plate{fill:none;stroke:#5b6573;stroke-width:5}
.x-handle{fill:none;stroke:#5b6573;stroke-width:3}
.x-cable{stroke:color-mix(in srgb, var(--muted) 60%, transparent);stroke-width:1.5}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}

/* ============ Health maths ============ */
const ACT = {sedentary:[1.2,"Sedentary (desk job, little exercise)"],light:[1.375,"Light (exercise 1–3 days/week)"],moderate:[1.55,"Moderate (exercise 3–5 days/week)"],active:[1.725,"Active (hard exercise 6–7 days/week)"],athlete:[1.9,"Very active (training twice a day / physical job)"]};
const GOALS = {lose:"Lose fat",maintain:"Maintain weight",gain:"Gain muscle"};
function bmi(w,h){return h? w/((h/100)**2) : 0}
function bmiCat(b){ if(!b) return ["—",""]; if(b<18.5) return ["Underweight","warn"]; if(b<25) return ["Healthy range","good"]; if(b<30) return ["Overweight","warn"]; return ["Obese","bad"]}
function bmiAsian(b){ if(b<18.5) return "Underweight"; if(b<23) return "Healthy"; if(b<25) return "Overweight"; return "Obese"}
function currentWeight(p){const w=(S.weights[p.id]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);return w.length? w[w.length-1].kg : p.weightKg}
function calcPlan(p,date){return withGoal(applyPlan(calcPlanBase(p),planFor(p,date||UI.date)),p)}
function calcPlanBase(p){
  const w=currentWeight(p), h=+p.heightCm, a=+p.age;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex==="m"?5:-161);
  const tdee = bmr*(ACT[p.activity]?.[0]||1.375);
  let target = p.goal==="lose"? tdee-500 : p.goal==="gain"? tdee+300 : tdee;
  const floor = p.sex==="m"?1500:1200;
  let floored = target<floor; target=Math.max(target,floor); const autoTarget=target;
  const cc=p.calcCustom||null; const custom=!!(cc&&cc.kcal>0);
  if(custom){target=cc.kcal;floored=false}
  const lowCustom=custom&&target<floor;
  const split={...MEAL_SPLIT}; if(cc&&cc.shares){const t=MEALS.reduce((a,[k])=>a+(+cc.shares[k]||0),0);if(t>0)MEALS.forEach(([k])=>split[k]=(+cc.shares[k]||0)/t)}
  const refW = bmi(w,h)>30 ? 25*((h/100)**2) : w;
  const pg = refW*(p.goal==="maintain"?1.2:1.6);
  const fg = target*0.25/9;
  const cg = Math.max(0,(target-pg*4-fg*9)/4);
  const meals={}; for(const [k] of MEALS){meals[k]={kcal:target*split[k],p:pg*split[k],c:cg*split[k],f:fg*split[k],share:split[k],items:[]}}
  return {bmr,tdee,target,p:pg,c:cg,f:fg,meals,floored,weight:w,source:"calc",custom,autoTarget,lowCustom,floor};
}
/* a trainer's plan wins; any value it leaves out falls back to the calculated one */
function applyPlan(calc,tp){
  if(!tp||!(tp.kcal>0)) return calc;
  const pg=calc.p;
  const T=tp.kcal, tP=tp.p>0?tp.p:pg, tF=tp.f>0?tp.f:T*0.25/9, tC=tp.c>0?tp.c:Math.max(0,(T-tP*4-tF*9)/4);
  const tm={}; const given=MEALS.filter(([k])=>tp.meals?.[k]?.kcal>0);
  const givenK=given.reduce((a,[k])=>a+tp.meals[k].kcal,0); const restShare=MEALS.filter(([k])=>!(tp.meals?.[k]?.kcal>0)).reduce((a,[k])=>a+MEAL_SPLIT[k],0)||1;
  for(const [k] of MEALS){const m=tp.meals?.[k]||{};
    const kcal=m.kcal>0?m.kcal:Math.max(0,T-givenK)*MEAL_SPLIT[k]/restShare; const sh=kcal/T;
    tm[k]={kcal,p:m.p>0?m.p:tP*sh,c:m.c>0?m.c:tC*sh,f:m.f>0?m.f:tF*sh,share:sh,items:m.items||[],labels:m.labels||[]}}
  return {...calc,target:T,p:tP,c:tC,f:tF,meals:tm,floored:false,source:"trainer",tp};
}

const DRIVE_BLOCK=["needs_reauth","server_not_connected","not_in_manifest","approval_required","selection_required","blocked_by_policy","no_mcp","consent_required","not_granted","capability_disabled"];
function b64ToText(b){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u).replace(/^﻿/,"")}
async function driveCall(tool,input){const mcp=await getMcp();if(!mcp)throw{code:"no_mcp"};const r=await mcp.callTool(GDRIVE,tool,input,{cache:false});return r&&r.payload}
async function driveRead(fileId){const p=await driveCall("download_file_content",{fileId});const c=p&&(p.content||p.base64Content);if(!c)throw{code:"empty"};const j=JSON.parse(b64ToText(c));if(!j||j.app!=="plate-progress")throw{code:"not_ours"};return j}
async function driveFind(){
  const r=await driveCall("search_files",{query:`title = '${DATA_TITLE}' and owner = 'me'`,pageSize:10,excludeContentSnippets:true});
  const files=((r&&r.files)||[]).sort((x,y)=>(x.modifiedTime||"")<(y.modifiedTime||"")?1:-1).slice(0,3);
  let best=null; for(const f of files){try{const j=await driveRead(f.id);if(!best||(j.savedAt||"")>(best.json.savedAt||""))best={id:f.id,json:j}}catch(e){if(e&&DRIVE_BLOCK.includes(e.code))throw e}}
  return best;
}
function makeDriveStore(db,id){
  const ptr=db.doc(`data/users/${id}/drive`);
  return {
    kind:"drive",
    async load(){
      const pp=await ptr.get(); let fid=pp.exists?pp.data().fileId:null; let data=null;
      if(fid){try{data=await driveRead(fid)}catch(e){if(e&&DRIVE_BLOCK.includes(e.code))throw e;fid=null}}
      if(!fid){const f=await driveFind();if(f){fid=f.id;data=f.json;await ptr.set({fileId:fid})}}
      DRV.fileId=fid; return data;
    },
    async setPtr(fid){await ptr.set({fileId:fid})},
    /* earlier versions kept data in Claude's storage; read it once so it can move to Drive */
    async legacy(){
      const base=`data/users/${id}`; const st=await db.doc(base+"/state").get(); if(!st.exists) return null;
      const all=await db.collection(base).get(); const meals={}; const ids=[];
      all.docs.forEach(d=>{if(d.id.startsWith("meals_")){const v=d.data();if(v&&v.pid&&v.ym){(meals[v.pid]=meals[v.pid]||{})[v.ym]=JSON.parse(JSON.stringify(v.entries||[]))}ids.push(d.id)}});
      return {state:JSON.parse(JSON.stringify(st.data())),meals,ids:["state",...ids]};
    },
    async dropLegacy(ids){for(const k of ids){try{await db.doc(`data/users/${id}/${k}`).delete()}catch(e){}}}
  };
}

function library(){return LIB.concat((S.ai||[]))}
function prefAllows(p,veg){return p.pref==="both"||(p.pref==="veg"?veg:!veg)||(p.pref==="nonveg")}
function recentRecipeIds(pid,date,days){const from=addDays(date,-days);const ids=new Map();allEntries(pid).forEach(e=>{if(e.recipeId&&e.date>=from&&e.date<=date){if(!ids.has(e.recipeId)||ids.get(e.recipeId)<e.date)ids.set(e.recipeId,e.date)}});return ids}
const NO_REPEAT_DAYS=14;
const STOP=new Set("option with without grams gram cups cup bowl small medium large glass piece pieces tbsp tsp teaspoon tablespoon fresh plain mixed whole serving slices slice sugarless sugar free boiled cooked roasted preferred full half quarter plate".split(" "));
function foodWords(items){const w=new Set();(items||[]).join(" ").toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).forEach(x=>{if(x.length>3&&!STOP.has(x))w.add(x.replace(/s$/,""))});return [...w]}
function suggest(p,meal,date,veg,offset,target,n){
  const code=MEALS.find(m=>m[0]===meal)[2];
  const plan=target||calcPlan(p,date).meals[meal]; n=n||3;
  const words=foodWords(plan.items);
  const overlap=r=>{if(!words.length)return 0;const hay=(r.name+" "+r.ingredients.join(" ")).toLowerCase();return words.filter(w=>hay.includes(w)).length};
  const recent=recentRecipeIds(p.id,date,NO_REPEAT_DAYS);
  const lastEver=new Map();allEntries(p.id).forEach(e=>{if(e.recipeId&&(!lastEver.has(e.recipeId)||lastEver.get(e.recipeId)<e.date))lastEver.set(e.recipeId,e.date)});
  let pool=library().filter(r=>r.meals.includes(code)&&r.veg===veg);
  const fresh=pool.filter(r=>!recent.has(r.id));
  const score=r=>Math.abs(r.kcal-plan.kcal)/Math.max(plan.kcal,1) + Math.max(0,(plan.p-r.p)/Math.max(plan.p,1))*0.6 - Math.min(overlap(r),3)*0.15;
  let list;
  if(fresh.length){ list=fresh.sort((a,b)=>score(a)-score(b)) }
  else { list=pool.sort((a,b)=>(lastEver.get(a.id)||"")<(lastEver.get(b.id)||"")?-1:1) }
  const start=list.length? (offset*n)%list.length : 0;
  const out=[];for(let i=0;i<Math.min(n,list.length);i++)out.push(list[(start+i)%list.length]);
  return {list:out,exhausted:!fresh.length,total:list.length,overlap};
}

  if(reduceMotion()) return;

  const cs=getComputedStyle(document.documentElement); const cols=[cs.getPropertyValue("--accent"),"#e8a23a","#3fa36b","#8b6cd6","#3b82c4"];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-10-3,r:Math.random()*5+3,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  const t0=performance.now();

}

  const r=EQ_RANK[loc]||EQ_RANK.home;

  c.sort((a,b)=>r[EX[a].eq]-r[EX[b].eq]);

/* ============ Workout access: one-time codes issued by the admin (the app's owner) ============
   Codes are never stored in plain text. The admin's page saves a slow hash of each code at codes/<id-hash>
   (only the owner can write there) plus a hash of a second "proof" value. Redeeming writes claims/<id-hash>
   with the person's id and the proof, so a code works for one person only. */
const ACC={db:null,user:null,uid:null,owner:false,granted:false,checked:false,why:""};
const CODE_ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode(){const a=new Uint32Array(8);crypto.getRandomValues(a);let s="";a.forEach(v=>s+=CODE_ABC[v%CODE_ABC.length]);return s.slice(0,4)+"-"+s.slice(4)}
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
async function kdf(code,purpose){
  const enc=new TextEncoder(); const key=await crypto.subtle.importKey("raw",enc.encode(normCode(code)),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode("plate-progress/"+purpose),iterations:150000},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function sha(hex){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(hex));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const hasWorkout=()=>ACC.owner||ACC.granted;
async function checkAccess(){
  ACC.checked=false;
  try{
    if(ACC.user&&ACC.user.isOwner&&ACC.user.isOwner()){ACC.owner=true;ACC.granted=true;ACC.checked=true;return}
    const mine=await ACC.db.doc(`data/users/${ACC.uid}/access`).get(); const h=mine.exists&&mine.data().h;
    if(!h){ACC.granted=false;ACC.checked=true;return}
    const [code,claim]=await Promise.all([ACC.db.doc("codes/"+h).get(),ACC.db.doc("claims/"+h).get()]);
    const ok=code.exists&&!code.data().revoked&&claim.exists&&claim.data().uid===ACC.uid&&(await sha(claim.data().proof||""))===code.data().pc;
    ACC.granted=!!ok; ACC.why=ok?"":(code.exists&&code.data().revoked?"revoked":"");
  }catch(e){console.warn(e);ACC.granted=false}
  ACC.checked=true;
}
async function redeemCode(raw){
  const msg=$("#accMsg"); const say=(h,bad)=>{if(msg)msg.innerHTML=`<span style="color:var(${bad?"--bad":"--good"})">${h}</span>`};
  const c=normCode(raw); if(c.length!==8){say("Codes have 8 letters and numbers, like K7QF-29XM.",true);return}
  say(`<span class="muted">Checking the code…</span>`);
  try{
    const h=await kdf(c,"id"); const code=await ACC.db.doc("codes/"+h).get();
    if(!code.exists||code.data().revoked){say("That code isn't valid. Check it with the admin.",true);return}
    const proof=await kdf(c,"proof"); if((await sha(proof))!==code.data().pc){say("That code isn't valid. Check it with the admin.",true);return}
    const ref=ACC.db.doc("claims/"+h); const lease=await ref.acquire({holder:ACC.uid,ttlMs:8000});
    if(!lease.acquired){say("Someone is using this code right now. Try again in a few seconds.",true);return}
    const cur=await ref.get();
    if(cur.exists&&cur.data().uid&&cur.data().uid!==ACC.uid){say("This code has already been used. Ask the admin for a new one.",true);return}
    if(!(cur.exists&&cur.data().uid===ACC.uid)) await ref.set({uid:ACC.uid,proof,at:new Date().toISOString()});
    await ACC.db.doc(`data/users/${ACC.uid}/access`).set({h,at:new Date().toISOString()});
    await checkAccess();
    if(hasWorkout()){UI.tab="workout";UI._view=null;render();setTimeout(confetti,120);toast("Workout unlocked. Welcome!")} else say("The code couldn't be confirmed. Try again.",true);
  }catch(e){console.warn(e);say(e&&e.code==="invalid_argument"?"Your access level can't save data here. Ask the admin to share the app with you as a Contributor.":"Couldn't check the code. Check your connection and try again.",true)}
}

async function adminGenerate(label){
  const code=newCode(); const h=await kdf(code,"id"); const pc=await sha(await kdf(code,"proof"));

}

const ACTS={walk:["Walking",3.5],brisk:["Brisk walking",4.3],run:["Running",9.8],jog:["Jogging",7],cycle:["Cycling",7.5],yoga:["Yoga",2.5],swim:["Swimming",7],badminton:["Badminton",5.5],cricket:["Cricket",5],football:["Football",8],dance:["Dancing",5],stairs:["Stair climbing",8],gym:["Gym session",5],hiit:["HIIT class",8],sports:["Other sport",6]};
const INTENS={light:["Light",0.8],moderate:["Moderate",1],hard:["Hard",1.25]};
function exMet(id){const e=EX[id];if(!e)return 5;if(e.cardio)return 8;if(id==="kbswing")return 9.8;if(e.static)return 3.8;if(e.pat==="core")return 3.8;if(e.eq==="gym"||["squat","hinge","lunge"].includes(e.pat))return 6;return 5}
function dayMet(day){let s=0,w=0;day.items.forEach(it=>{const n=+it.sets||3;s+=exMet(it.ex)*n;w+=n});return w?s/w:5}
function burnFor(p,met,mins,intensity){return Math.round(met*(INTENS[intensity]?.[1]||1)*currentWeight(p)*mins/60)}
function burnedOn(p,date){
  if(!hasWorkout()) return {kcal:0,mins:0,sessions:0};
  const lg=wlogOf(p,date); if(!lg) return {kcal:0,mins:0,sessions:0};
  let kcal=0,mins=0,sessions=0;

  return {kcal,mins,sessions};
}

/* ============ Hosted version: workout access codes ============
   Codes are tied to one Google account. The admin creates a code in the app, then adds the line it shows to
   access-codes.json in the GitHub repository. Only a slow hash of "code + email" is published, never the code.
   Turning a code off = delete its line (or add "off": true) and commit. */
async function ppHash(str){
  const enc=new TextEncoder(); const key=await crypto.subtle.importKey("raw",enc.encode(str),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode("plate-progress/access/v1"),iterations:150000},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
const codeKey=(code,email)=>ppHash(normCode(code)+"|"+String(email||"").trim().toLowerCase());
async function loadCodeList(){
  try{const r=await fetch("access-codes.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return [];const j=await r.json();return Array.isArray(j)?j:[]}catch(e){return []}
}
async function checkAccess(){
  ACC.checked=false;
  if(ACC.user&&ACC.user.isOwner()){ACC.owner=true;ACC.granted=true;ACC.checked=true;return}
  ACC.owner=false; const list=await loadCodeList(); UI.codes=list;
  const h=S.accessH; const hit=h&&list.find(x=>x&&x.h===h);
  ACC.granted=!!(hit&&!hit.off); ACC.why=h&&!ACC.granted?"revoked":""; ACC.checked=true;
}
async function redeemCode(raw){
  const msg=$("#accMsg"); const say=(h,bad)=>{if(msg)msg.innerHTML=`<span style="color:var(${bad?"--bad":"--good"})">${h}</span>`};
  const c=normCode(raw); if(c.length!==8){say("Codes have 8 letters and numbers, like K7QF-29XM.",true);return}
  say(`<span class="muted">Checking the code…</span>`);
  const email=PP.user&&PP.user.email; const h=await codeKey(c,email); const list=await loadCodeList(); const hit=list.find(x=>x&&x.h===h);
  if(!hit){say(`That code doesn't match your Google account (${esc(email)}). Codes only work for the account they were made for. Check it with the admin.`,true);return}
  if(hit.off){say("This code has been turned off. Ask the admin for a new one.",true);return}
  S.accessH=h; saveState(); await checkAccess();
  UI.tab="workout"; UI._view=null; render(); setTimeout(confetti,120); toast("Workout unlocked. Welcome!");
}

/* ============ Hosted version: free nutrition lookup (Open Food Facts) ============
   Used when the AI helper isn't set up. Searches the free Open Food Facts database (packaged and branded foods)
   straight from the browser: no key, no account, and only the typed food name is sent. */
const OFF_FIX={protien:"protein",protine:"protein",proteen:"protein",wey:"whey",whay:"whey",biscut:"biscuit",chocklate:"chocolate",choclate:"chocolate",panner:"paneer",yougurt:"yogurt",yoghurt:"yogurt"};
const offClean=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(Boolean).map(w=>OFF_FIX[w]||w).join(" ");
async function offSearch(q){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),15000);
  try{
    const u="https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=12&fields=code,product_name,brands,serving_size,nutriments,countries_tags&search_terms="+encodeURIComponent(q);
    const r=await fetch(u,{signal:ctl.signal}); if(!r.ok) throw new Error("http "+r.status);
    const j=await r.json(); return Array.isArray(j.products)?j.products:[];
  } finally {clearTimeout(tm)}
}
function offValues(pr){
  const n=pr.nutriments||{}; const num=v=>{const x=parseFloat(v);return isFinite(x)?x:null};
  const kcalOf=sfx=>num(n["energy-kcal_"+sfx])??(num(n["energy_"+sfx])!=null&&(n.energy_unit||"kJ")!=="kcal"?num(n["energy_"+sfx])/4.184:num(n["energy_"+sfx]));
  const per=kcalOf("serving")!=null&&pr.serving_size?"serving":"100g";
  const kcal=kcalOf(per); if(kcal==null) return null;
  return {qty:per==="serving"?String(pr.serving_size):"100 g",kcal,p:num(n["proteins_"+per])||0,c:num(n["carbohydrates_"+per])||0,f:num(n["fat_"+per])||0,
    name:[pr.brands&&String(pr.brands).split(",")[0].trim(),pr.product_name].filter(Boolean).join(" ").trim()||pr.product_name||"",per};
}
async function offLookup(){
  const st=$("#ff_status"); const typed=$("#ff_name").value.trim();
  if(!typed){st.innerHTML=`<span style="color:var(--bad)">Type the food's name first, e.g. the brand and product.</span>`;return}
  const q=offClean(typed); st.innerHTML=`<span class="muted">Searching the Open Food Facts database for ${esc(q)}…</span>`;
  let list=[];
  try{
    list=await offSearch(q);
    if(!list.length&&q.split(" ").length>2) list=await offSearch(q.split(" ").slice(0,3).join(" "));
  }catch(e){st.innerHTML=`<span style="color:var(--bad)">The nutrition database didn't answer. Check your connection and try again, or enter the values from the pack label.</span>`;return}
  const rows=list.map(pr=>({pr,v:offValues(pr),in:(pr.countries_tags||[]).includes("en:india")})).filter(x=>x.v&&x.v.name)
    .sort((a,b)=>(b.in-a.in)).slice(0,6);
  UI._off=rows.map(x=>x.v);
  if(!rows.length){st.innerHTML=`<span style="color:var(--bad)">No match for "${esc(typed)}". This lookup covers packaged and branded foods; check the spelling or try just the brand and product (e.g. "whole truth whey"). For home-cooked food, enter the values yourself.</span>`;return}
  st.innerHTML=`<div class="small muted" style="margin:4px 0">Pick the closest match:</div><div class="col" style="display:grid;gap:6px">${rows.map((x,i)=>`<button type="button" style="text-align:left;justify-content:flex-start;width:100%;display:block;line-height:1.35" data-act="offPick" data-i="${i}"><b>${esc(x.v.name)}</b> <span class="muted">· ${r0(x.v.kcal)} kcal, ${r1(x.v.p)} g protein per ${esc(x.v.qty)}${x.in?" · India":""}</span></button>`).join("")}</div>`;
}
function offPick(i){
  const v=(UI._off||[])[i]; if(!v) return; const st=$("#ff_status");
  fillFood({name:v.name,qty:v.qty,kcal:v.kcal,p:v.p,c:v.c,f:v.f}); $("#ff_mult").value=1; $("#ff_save").checked=true;
  st.innerHTML=`<span style="color:var(--good)">Filled in for ${esc(v.qty)}.</span> <span class="muted">From Open Food Facts, a free community database. Check it against your pack label${v.per==="100g"?"; values are per 100 g, so set \"Times this amount\" for your portion (e.g. 0.3 for 30 g)":""}.</span>`;
}

  const items=[["Protein","p","g"],["Carbs","c","g"],["Fat","f","g"]];
  return `<div class="macros">${items.map(([lab,k,u])=>{const pct=Math.min(100,t[k]/plan[k]*100||0);return `<div class="macro"><div class="row small"><b>${lab}</b><span class="spacer"></span><span class="num">${r0(t[k])} / ${r0(plan[k])}${u}</span></div><div class="bar ${t[k]>plan[k]*1.1?"over":""}"><i style="width:${pct}%"></i></div></div>`}).join("")}</div>`;
}

      <tr><td><b>Day total</b></td><td class="r num">100%</td><td class="r"><input class="kin num day" type="number" inputmode="numeric" min="0" step="any" id="kin_day" data-kcal="day" data-plan="${viewId}" value="${r0(pl.target)}" aria-label="Daily calories"></td><td class="r num"><b>${r0(pl.p)}g</b></td><td class="r num"><b>${r0(pl.c)}g</b></td><td class="r num"><b>${r0(pl.f)}g</b></td>${pl.source==="trainer"?"<td></td>":""}</tr></tbody>

function dailySeries(p,days){const out=[];for(let i=days-1;i>=0;i--){const d=addDays(today(),-i);const t=totals(entriesOn(p.id,d));out.push({date:d,...t,n:entriesOn(p.id,d).length,target:calcPlan(p,d).target})}return out}
function weightChart(p){
  const ws=(S.weights[p.id]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(ws.length<2) return `<div class="note">Log your weight at least twice to see the trend line. Weekly, same time of day, works best.</div>`;
  const W=640,H=230,L=44,R=14,T=14,B=28;
  const t0=parseD(ws[0].date).getTime(), t1=parseD(ws[ws.length-1].date).getTime()||t0+1;
  const vals=ws.map(w=>w.kg); if(p.targetWeight) vals.push(+p.targetWeight);
  let lo=Math.floor(Math.min(...vals)-1), hi=Math.ceil(Math.max(...vals)+1);
  const x=d=>L+(parseD(d).getTime()-t0)/Math.max(1,t1-t0)*(W-L-R);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const step=Math.max(1,Math.ceil((hi-lo)/5)); let grid="";
  for(let v=lo;v<=hi;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  const pts=ws.map(w=>`${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(" ");
  const area=`${L},${H-B} ${pts} ${x(ws[ws.length-1].date).toFixed(1)},${H-B}`;
  const tgt=p.targetWeight?`<line x1="${L}" x2="${W-R}" y1="${y(+p.targetWeight)}" y2="${y(+p.targetWeight)}" stroke="var(--warn)" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(+p.targetWeight)-5}" text-anchor="end">goal ${p.targetWeight} kg</text>`:"";
  const last=ws[ws.length-1];
  const lbl=[ws[0],ws[Math.floor(ws.length/2)],last].filter((v,i,a)=>a.indexOf(v)===i).map((w,i,a)=>`<text x="${x(w.date)}" y="${H-8}" text-anchor="${i===0?"start":i===a.length-1?"end":"middle"}">${fmtShort(w.date)}</text>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">${grid}<polygon points="${area}" fill="var(--accent)" fill-opacity="0.12"/>${tgt}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${ws.map(w=>`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3" fill="var(--accent)"/>`).join("")}<circle cx="${x(last.date)}" cy="${y(last.kg)}" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>${lbl}</svg></div>`;
}
function kcalChart(series){
  const W=640,H=200,L=44,R=10,T=12,B=28; const max=Math.max(...series.map(s=>Math.max(s.kcal,s.target)))*1.1||1;
  const bw=(W-L-R)/series.length; const y=v=>T+(1-v/max)*(H-T-B);
  const tgt=series[0].target; let g="";
  const step=Math.ceil(max/4/500)*500; for(let v=0;v<=max;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  const bars=series.map((s,i)=>{const h=H-B-y(s.kcal);const over=s.kcal>s.target*1.1;return `<rect x="${(L+i*bw+bw*0.18).toFixed(1)}" y="${y(s.kcal).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="${over?"var(--warn)":"var(--accent)"}" fill-opacity="${s.n?1:0}"><title>${fmtShort(s.date)}: ${r0(s.kcal)} kcal</title></rect>${i%3===0||i===series.length-1?`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${fmtShort(s.date)}</text>`:""}`}).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">${g}${bars}<line x1="${L}" x2="${W-R}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-opacity=".6"/><text x="${W-R}" y="${y(tgt)-5}" text-anchor="end">target ${fmtN(tgt)}</text></svg></div>`;
}
function viewProgress(p){
  const pl=calcPlan(p); const cw=pl.weight; const sw=+p.startWeight||+p.weightKg; const ch=cw-sw;
  const b=bmi(cw,p.heightCm), b0=bmi(sw,p.heightCm); const [cat,cls]=bmiCat(b);
  const s14=dailySeries(p,14); const logged=s14.filter(s=>s.n);
  const avg=logged.length? sum(logged,"kcal")/logged.length:0; const avgP=logged.length? sum(logged,"p")/logged.length:0;
  const onTarget=logged.filter(s=>Math.abs(s.kcal-s.target)<=s.target*0.1).length;
  let streak=0; for(let i=0;;i++){if(entriesOn(p.id,addDays(today(),-i)).length)streak++;else if(i===0)continue;else break; if(i>400)break}
  const toGo=p.targetWeight? cw-(+p.targetWeight):null;
  const ws=(S.weights[p.id]||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  return `
  <div class="grid g4">
    <div class="tile"><span class="label">Current weight</span><span class="big num">${r1(cw)} kg</span><span class="small ${ch<=0&&p.goal==="lose"||ch>=0&&p.goal==="gain"?"":"muted"}">${ch===0?"No change":(ch>0?"+":"")+r1(ch)+" kg"} since start (${r1(sw)} kg)</span></div>
    <div class="tile"><span class="label">BMI</span><span class="big num">${r1(b)}</span><span class="small muted">was ${r1(b0)} · <span class="pill ${cls}">${cat}</span></span></div>
    <div class="tile"><span class="label">To goal</span><span class="big num">${toGo===null?"—":r1(Math.abs(toGo))+" kg"}</span><span class="small muted">${toGo===null?"Set a goal weight in Profile":(p.targetWeight+" kg goal")}</span></div>
    <div class="tile"><span class="label">Logging streak</span><span class="big num">${streak} day${streak===1?"":"s"}</span><span class="small muted">${onTarget}/${logged.length} logged days within ±10% of target</span></div>
  </div>
  <section class="panel">
    <div class="row"><h2>Weight</h2><span class="spacer"></span>
      <form class="row" id="wForm"><input type="date" id="wDate" value="${today()}" style="width:auto" aria-label="Date"><input type="number" id="wKg" step="0.1" min="20" max="350" placeholder="kg" style="width:90px" aria-label="Weight in kg" required><button class="primary" type="submit">Log weight</button></form></div>
    ${weightChart(p)}
    ${ws.length?`<details><summary class="small">Weight entries (${ws.length})</summary><div class="scroll"><table><tbody>${ws.map(w=>`<tr><td>${fmtDay(w.date)}</td><td class="r num">${r1(w.kg)} kg</td><td class="r num">BMI ${r1(bmi(w.kg,p.heightCm))}</td><td class="r"><button class="ghost" data-act="delW" data-date="${w.date}">Remove</button></td></tr>`).join("")}</tbody></table></div></details>`:""}
  </section>
  <section class="panel">
    <div class="row"><h2>Calories, last 14 days</h2><span class="spacer"></span><span class="pill num">avg ${fmtN(avg)} kcal</span><span class="pill num">avg protein ${r0(avgP)}g / ${r0(pl.p)}g</span></div>
    ${kcalChart(s14)}
    <div class="scroll"><table><thead><tr><th>Date</th><th class="r">Calories</th><th class="r">Protein</th><th class="r">Carbs</th><th class="r">Fat</th><th class="r">Items</th></tr></thead>
    <tbody>${s14.slice().reverse().map(s=>`<tr><td>${fmtDay(s.date)}</td><td class="r num">${s.n?fmtN(s.kcal):"—"}</td><td class="r num">${s.n?r0(s.p)+"g":"—"}</td><td class="r num">${s.n?r0(s.c)+"g":"—"}</td><td class="r num">${s.n?r0(s.f)+"g":"—"}</td><td class="r num">${s.n}</td></tr>`).join("")}</tbody></table></div>
  </section>
  ${activitySection(p)}`;
}

/* ============ WhatsApp text ============ */
/* ---- WhatsApp text, with icons (or plain if the person prefers) ---- */
const MEAL_EMOJI={breakfast:"🌅",lunch:"🍛",snack:"🍎",dinner:"🌙"};
function waLine(e,ic){
  const tm=e.time?fmtTime(e.time):"";
  if(!ic) return `• ${tm?tm+" ":""}${e.name}${e.qty?` (${e.qty})`:""} – ${r0(e.kcal)} kcal, P ${r0(e.p)}g`;
  return `${e.veg?"🟢":"🔺"} ${tm?`🕐 ${tm} · `:""}*${e.name}*${e.qty?` (${e.qty})`:""}\n      🔥 ${r0(e.kcal)} kcal · 💪 ${r0(e.p)} g protein`;
}
function statusLine(left,ic){
  if(Math.abs(left)<=50) return ic?"✅ Right on target":"On target";
  return left>0?`${ic?"⏳ ":""}${fmtN(left)} kcal left`:`${ic?"⚠️ ":""}${fmtN(-left)} kcal over`;
}
function mealText(p,date,meal,plain){
  const ic=!plain; const lab=MEALS.find(m=>m[0]===meal)[1]; const es=entriesOn(p.id,date,meal); const t=totals(es); const pl=calcPlan(p,date);
  const day=totals(entriesOn(p.id,date)); const tg=pl.meals[meal];
  if(!ic) return [`*${lab}* – ${fmtDay(date)}`,`${p.name}`,...es.map(e=>waLine(e,false)),``,`Meal total: ${r0(t.kcal)} kcal | P ${r0(t.p)}g | C ${r0(t.c)}g | F ${r0(t.f)}g`,`Day so far: ${fmtN(day.kcal)} / ${fmtN(pl.target)} kcal | Protein ${r0(day.p)} / ${r0(pl.p)}g`].join("\n");
  return [`${MEAL_EMOJI[meal]} *${lab.toUpperCase()}* · ${fmtDay(date)}`,`👤 ${p.name}`,`━━━━━━━━━━━━━━`,
    ...es.map(e=>waLine(e,true)),`━━━━━━━━━━━━━━`,
    `🍽️ *Meal total:* ${r0(t.kcal)} kcal (target ${r0(tg.kcal)})`,`💪 Protein ${r0(t.p)} g · 🍚 Carbs ${r0(t.c)} g · 🥑 Fat ${r0(t.f)} g`,``,
    `📊 *Day so far:* ${fmtN(day.kcal)} / ${fmtN(pl.target)} kcal`,`💪 Protein ${r0(day.p)} / ${r0(pl.p)} g`,statusLine(pl.target-day.kcal,true)].join("\n");
}
function dayText(p,date,plain){
  const ic=!plain; const pl=calcPlan(p,date); const t=totals(entriesOn(p.id,date));
  const wml=sum(waterOn(p.id,date),"ml"), wg=waterGoal(p); const cof=coffeeOn(p.id,date);
  const planNm=plansOf(p).length?planName(p,planChoice(p,date)):"";
  if(!ic){
    const lines=[`*Food log* – ${fmtDay(date)}`,`${p.name} · ${r1(pl.weight)} kg`];
    for(const [k,l] of MEALS){const es=entriesOn(p.id,date,k);lines.push("",`*${l}*`+(es.length?` (${r0(sum(es,"kcal"))} kcal)`:""));if(!es.length)lines.push("• —");es.forEach(e=>lines.push(waLine(e,false)))}
    lines.push("",`Total: ${fmtN(t.kcal)} / ${fmtN(pl.target)} kcal | P ${r0(t.p)}g | C ${r0(t.c)}g | F ${r0(t.f)}g`,`Water: ${r1(wml/1000)} / ${r1(wg/1000)} L`);
    if(cof.length) lines.push(`Black coffee: ${cof.length} cup${cof.length>1?"s":""} (${cof.map(e=>fmtTime(e.time)).join(", ")})`);
    return lines.join("\n");
  }
  const lines=[`📒 *DAILY FOOD LOG*`,`📅 ${fmtDay(date)}`,`👤 ${p.name} · ⚖️ ${r1(pl.weight)} kg${planNm?`\n📋 Plan: ${planNm}`:""}`,`━━━━━━━━━━━━━━`];
  for(const [k,l] of MEALS){const es=entriesOn(p.id,date,k);
    lines.push("",`${MEAL_EMOJI[k]} *${l}*${es.length?` — ${r0(sum(es,"kcal"))} kcal`:""}`);
    if(!es.length) lines.push("   ➖ Nothing logged"); else es.forEach(e=>lines.push(waLine(e,true)));}
  const water=Math.round(Math.min(1,wml/wg)*10);
  lines.push("",`━━━━━━━━━━━━━━`,`🔥 *Total:* ${fmtN(t.kcal)} / ${fmtN(pl.target)} kcal`,`💪 Protein ${r0(t.p)} / ${r0(pl.p)} g`,`🍚 Carbs ${r0(t.c)} g · 🥑 Fat ${r0(t.f)} g`,
    `💧 Water ${r1(wml/1000)} / ${r1(wg/1000)} L  ${"🟦".repeat(water)}${"⬜".repeat(10-water)}`);
  if(cof.length) lines.push(`☕ Black coffee: ${cof.length} cup${cof.length>1?"s":""} (${cof.map(e=>fmtTime(e.time)).join(", ")})`);
  const bd=burnedOn(p,date); if(bd.kcal) lines.push(`🏋️ Burned: ${fmtN(bd.kcal)} kcal in ${bd.mins} min`);

  return lines.join("\n");
}

const GDRIVE="Google Drive";
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const SYNC={state:"idle",msg:"",timer:null,running:false,again:false,manual:false};
const sheetTitle=p=>`Plate & Progress – ${p.name} food log.xlsx`;
function b64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function getMcp(){if(!(window.claude&&claude.use))return null;try{return await claude.use("mcp")}catch(e){return null}}
function driveError(e){
  const c=e&&e.code;
  if(c==="server_not_connected"||c==="server_not_found") return {title:"Google Drive isn't connected",body:"Continue with Google and allow access to Google Drive when asked. The profile was not created."};
  if(c==="needs_reauth") return {title:"Google sign-in has expired",body:"Sign in with Google again, then try again. The profile was not created."};
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required") return {title:"Google access was not allowed",body:"This app needs access to your Google Drive to keep your Excel food log. Allow access when asked, then try again. The profile was not created."};
  if(c==="selection_required") return {title:"Choose a Google account",body:"You have more than one Google Drive connection. Pick one when asked, then try again."};
  if(c==="blocked_by_policy") return {title:"Google Drive is blocked for your account",body:"Your organization doesn't allow this app to use Google Drive, so a profile can't be created."};
  if(c==="server_unavailable") return {title:"Google Drive didn't respond",body:"Wait a moment and try again. Check your Drive in case the file was created anyway."};
  return {title:"Couldn't reach Google Drive",body:(e&&e.message&&c==="tool_error"?e.message:"Something went wrong talking to Google Drive.")+" The profile was not created."};
}
async function uploadSheet(mcp,p){
  const res=await mcp.callTool(GDRIVE,"create_file",{title:sheetTitle(p),base64Content:b64(buildWorkbook(p)),contentMimeType:XLSX_MIME,disableConversionToGoogleType:true},{cache:false});
  const f=res&&res.payload; if(!f||!f.id) throw {code:"tool_error",message:"Google Drive didn't return the new file."};
  return {fileId:f.id,viewUrl:f.viewUrl||`https://drive.google.com/file/d/${f.id}/view`};
}
/* new profile: requires Google access, otherwise nothing is created */
async function createProfileWithGoogle(d,w){
  const mcp=await getMcp();
  if(!mcp){UI.gateError={title:"Google sign-in isn't available here",body:"Sign in with Google first. The profile was not created."};render();return}
  const id=uid(); const p={id,...d,weightKg:w,startWeight:w,startDate:today()};
  const tmpW={...S.weights,[id]:[{date:today(),kg:w}]}; const oldW=S.weights; S.weights=tmpW; MEAL_DOCS[id]={};
  UI.creating=true;UI.gateError=null;render();
  try{

/* keep the Drive copy current: upload a fresh workbook, then move the previous one to Trash */
function scheduleSync(){const p=P();if(!p||!p.drive)return;SYNC.state="pending";paintSync();clearTimeout(SYNC.timer);if(SYNC.manual)return;SYNC.timer=setTimeout(()=>runSync(false),6000)}
async function runSync(fromClick){
  const p=P(); if(!p||!p.drive) return;
  if(SYNC.running){SYNC.again=true;return}
  const mcp=await getMcp(); if(!mcp){SYNC.state="err";SYNC.msg="Sign in with Google to sync.";paintSync();return}
  SYNC.running=true;SYNC.state="busy";paintSync();
  try{
    await ensureMeals(p.id);
    const old=p.drive.fileId; const nf=await uploadSheet(mcp,p);
    p.drive={...nf,syncedAt:new Date().toISOString()}; saveState();
    if(old&&old!==nf.fileId){ mcp.callTool(GDRIVE,"trash_file",{fileId:old},{cache:false}).catch(()=>{}) }
    SYNC.state="ok";SYNC.msg="";SYNC.manual=false;
  }catch(e){
    const c=e&&e.code; SYNC.state="err";
    if(c==="approval_required"||c==="not_in_manifest"){SYNC.manual=true;SYNC.msg="Google Drive needs your approval to update the sheet. Tap Sync now."}
    else if(c==="server_not_connected"||c==="needs_reauth"){SYNC.manual=true;SYNC.msg="Sign in with Google again, then tap Sync now."}

      const e={id:String(r.entryid||"").trim()||uid(),date:d,time:tm||undefined,meal,name,qty:String(r.quantity||""),kcal:+r.calories||0,p:+r.proteing||0,c:+r.carbsg||0,f:+r.fatg||0,veg:!/non/i.test(String(r.type)),source:"import"};

const readerOK=()=>!!sampleFn;
const imgMax=()=>UI.limits?.images?.maxCount||0;
const READ_ERR={not_granted:"The AI helper isn't available right now. Fill the fields in by hand.",sampling_disabled:"The AI helper isn't set up on this site, so files can't be read. Fill the fields in by hand.",rate_limited:"The AI helper is busy right now. Try again in a few minutes.",image_rejected:"That image couldn't be read. Try a clearer photo as JPG or PNG.",images_unavailable:"Photos can't be read in this view. Upload a PDF with selectable text, or fill the fields by hand.",invalid_json:"The file was read but the details couldn't be picked out. Try a clearer copy.",refused:"This file couldn't be read. Try a different copy."};
async function shrinkImage(file){
  const lim=UI.limits?.images; const ok=lim&&lim.mediaTypes?.includes(file.type)&&file.size<=lim.maxInputBytes;
  if(ok) return file;
  const bmp=await createImageBitmap(file); const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
}
async function readDocument(file){
  const isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name);
  if(isPdf){
    if(!window.pdfjsLib) throw {code:"reader",message:"The PDF reader didn't load. Reload the page, or upload a photo of the page instead."};
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    let text=""; for(let i=1;i<=Math.min(pdf.numPages,6);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(t=>t.str+(t.hasEOL?"\n":" ")).join("")+"\n\n"}
    if(text.replace(/\s/g,"").length>=120) return {text:text.slice(0,40000)};
    const n=Math.min(imgMax(),3,pdf.numPages);
    if(!n) throw {code:"images_unavailable"};
    const images=[]; for(let i=1;i<=n;i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;images.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)))}
    return {images};
  }
  if(!/^image\//.test(file.type)) throw {code:"reader",message:"Upload a PDF or a photo (JPG, PNG or WebP)."};
  if(!imgMax()) throw {code:"images_unavailable"};
  return {images:[await shrinkImage(file)]};
}
async function askDoc(instr,doc){
  const input=doc.text? `${instr}\n\nDOCUMENT TEXT (extracted from a PDF):\n${doc.text}` : `${instr}\n\nThe document is attached as ${doc.images.length>1?doc.images.length+" page images":"an image"}.`;
  return await sampleFn.json(input,doc.images?{images:doc.images}:{});
}
const readErr=e=>(e&&(READ_ERR[e.code]||e.message&&e.code==="reader"&&e.message))||"The file couldn't be read. Try again, or fill the fields by hand.";

const REPORT_PROMPT=`Read this BMI / body-composition / health check report and extract the person's details. Convert height to centimetres and weight to kilograms (1 lb = 0.4536 kg, 1 in = 2.54 cm). Use null for anything the report does not show; do not guess.

const PLAN_PROMPT=`These are diet plans written by a fitness trainer or dietitian. One document may hold SEVERAL separate plans (for example a vegetarian plan and a non-vegetarian plan, Plan A / Plan B, training-day and rest-day plans, or 1500 kcal and 1800 kcal versions). Return each separate plan as its own entry in "plans". Do not merge different plans together.
For each plan:
- "name": the plan's own title if it has one, otherwise a short descriptive name such as "Vegetarian plan".
- "type": "veg" if it has no meat, fish or eggs; "nonveg" if it includes meat, fish or eggs; "mixed" if it is unclear.
- "days": weekdays the plan says it is for, as lowercase three-letter names ("mon","tue",...), or [] if not stated.
- Map every meal to one of "breakfast","lunch","snack","dinner". Early-morning, mid-morning, pre-workout, post-workout and evening meals are "snack" unless they are clearly the main breakfast or dinner. Keep the original meal name in "label".
- List foods with quantities as written. When the plan offers alternatives for a meal, keep each as its own item starting "Option 1:", "Option 2:" and so on.
- If calories or macros are given, use them exactly. If missing, estimate them from the foods (Indian home portions; for meals with options, use the first option) and set "estimated" true.
- "notes": up to 5 short instructions from the plan (water, supplements, timing, things to avoid).
Reply with only JSON: {"isDietPlan":boolean,"plans":[{"name":string,"type":"veg"|"nonveg"|"mixed","days":[string],"dailyKcal":number|null,"proteinG":number|null,"carbsG":number|null,"fatG":number|null,"meals":[{"meal":"breakfast"|"lunch"|"snack"|"dinner","label":string,"time":string|null,"items":[string],"kcal":number|null,"proteinG":number|null,"carbsG":number|null,"fatG":number|null}],"notes":[string],"estimated":boolean}]}
Set isDietPlan false if the document is not a diet or meal plan.`;
const PLAN_TYPES={veg:"Vegetarian",nonveg:"Non-vegetarian",mixed:"Mixed"};
const WEEK=[["mon","Mon"],["tue","Tue"],["wed","Wed"],["thu","Thu"],["fri","Fri"],["sat","Sat"],["sun","Sun"]];
const dayKey=date=>["sun","mon","tue","wed","thu","fri","sat"][parseD(date).getDay()];
function normPlan(j,src){
  const meals={}; for(const [k] of MEALS) meals[k]={kcal:0,p:0,c:0,f:0,items:[],labels:[]};
  for(const m of (j.meals||[])){
    let k=String(m.meal||"").toLowerCase(); if(!meals[k]){const l=String(m.label||"").toLowerCase();k=/break/.test(l)?"breakfast":/lunch/.test(l)?"lunch":/dinner|supper/.test(l)?"dinner":"snack"}
    const t=meals[k]; t.kcal+=+m.kcal||0;t.p+=+m.proteinG||0;t.c+=+m.carbsG||0;t.f+=+m.fatG||0;
    (m.items||[]).forEach(x=>t.items.push(String(x))); if(m.label) t.labels.push(String(m.label)+(m.time?` (${m.time})`:""));
  }
  const sm=k=>Object.values(meals).reduce((a,m)=>a+m[k],0);

  const days=(j.days||[]).map(d=>String(d).toLowerCase().slice(0,3)).filter(d=>WEEK.some(w=>w[0]===d));
  return {name:String(j.name||PLAN_TYPES[type]+" plan").slice(0,60),type,days,kcal:+j.dailyKcal||sm("kcal"),p:+j.proteinG||sm("p"),c:+j.carbsG||sm("c"),f:+j.fatG||sm("f"),meals,notes:(j.notes||[]).map(String).slice(0,5),estimated:!!j.estimated,source:src,uploaded:today()};

async function handlePlans(files){

  if(!(tp.kcal>0)){const b=$("#tpError");if(b){b.hidden=false;b.innerHTML="<b>Add the daily calories, or calories for each meal, before saving.</b>"}return}
  p.trainerPlans=plansOf(p).slice();

  if($("#tp_days")?.checked&&pp.days?.length){p.planSchedule={...(p.planSchedule||{})};pp.days.forEach(d=>p.planSchedule[d]=tp.id)}

}

/* calories typed into the diet chart */
function editKcal(planId,key,raw){
  const p=P(); let val=parseFloat(String(raw).replace(",","."));
  if(!(val>0)){toast("Enter calories above zero.");render();return}
  if(p.kcalGoal>0){
    if(key==="day"){setGoal(val);return}
    /* keep the typed meal value exact: move the goal by the same amount and edit the plan in its own scale */
    const eff=applyPlan(calcPlanBase(p),planId==="calc"?null:plansOf(p).find(x=>x.id===planId));
    const r=p.kcalGoal/eff.target; const shown=eff.meals[key].kcal*r;
    p.kcalGoal=Math.round(p.kcalGoal+(val-shown)); val=val/r;
  }
  if(planId==="calc"){
    const base=calcPlanBase(p);
    if(key==="day") p.calcCustom={...(p.calcCustom||{}),kcal:val};
    else{const kc={};MEALS.forEach(([k])=>kc[k]=base.meals[k].kcal);kc[key]=val;p.calcCustom={kcal:MEALS.reduce((a,[k])=>a+kc[k],0),shares:kc}}
  }else{
    const tp=plansOf(p).find(x=>x.id===planId); if(!tp) return;
    if(!tp.orig) tp.orig=JSON.parse(JSON.stringify({kcal:tp.kcal,p:tp.p,c:tp.c,f:tp.f,meals:tp.meals}));
    const eff=applyPlan(calcPlanBase(p),tp);
    tp.meals=tp.meals||{};
    MEALS.forEach(([k])=>{const m=tp.meals[k]=tp.meals[k]||{items:[],labels:[]};const e=eff.meals[k];m.kcal=e.kcal;m.p=e.p;m.c=e.c;m.f=e.f});
    if(key==="day"){const r=val/eff.target;tp.kcal=val;tp.p=eff.p*r;tp.c=eff.c*r;tp.f=eff.f*r;MEALS.forEach(([k])=>{const m=tp.meals[k];m.kcal*=r;m.p*=r;m.c*=r;m.f*=r})}
    else{const m=tp.meals[key];const r=m.kcal>0?val/m.kcal:1;tp.kcal=eff.target+(val-m.kcal);tp.p=eff.p+m.p*(r-1);tp.c=eff.c+m.c*(r-1);tp.f=eff.f+m.f*(r-1);m.kcal=val;m.p*=r;m.c*=r;m.f*=r}
  }
  saveState(); scheduleSync(); render(); toast("Calorie targets updated");
}
function resetKcal(planId){
  const p=P();
  if(planId==="calc") delete p.calcCustom;
  else{const tp=plansOf(p).find(x=>x.id===planId); if(tp&&tp.orig){Object.assign(tp,tp.orig);delete tp.orig}}
  saveState(); scheduleSync(); render(); toast("Calories reset");
}
