  else if(a==="setAccent"){setAccent(el.dataset.accent);S.accent=el.dataset.accent;saveState()}
  else if(a==="clearGoal"){delete p.kcalGoal;saveState();scheduleSync();render();toast("Goal cleared. Using the plan's own calories.")}
  else if(a==="coachShuffle"){UI.coachOffset=(UI.coachOffset||0)+1;UI._view=null;render()}
  else if(a==="quickAdd"){const n=el.dataset.name,f=FOODS[n];addEntry(p.id,{id:uid(),date:UI.date,time:timeFor(UI.date,defaultMeal()),meal:defaultMeal(),name:n,qty:f[0],kcal:f[1],p:f[2],c:f[3],f:f[4],veg:!!f[5],source:"custom"});render();toast(`Added ${n} to ${MEALS.find(m=>m[0]===defaultMeal())[1]}`)}
  else if(a==="lookupFood"){readerOK()?lookupFood():offLookup()}
  else if(a==="offPick"){offPick(+el.dataset.i)}
  else if(a==="delMyFood"){delete S.myFoods[el.dataset.name];saveState();render();toast("Removed from My foods")}
  else if(a==="resetKcal"){resetKcal(el.dataset.plan)}
  else if(a==="planShuffle"){UI.planRecOffset=(UI.planRecOffset||0)+1;render()}
  else if(a==="usePlanDay"){S.planByDate=S.planByDate||{};const m=S.planByDate[p.id]=S.planByDate[p.id]||{};m[UI.date]=el.dataset.id;saveState();render();toast(planName(p,el.dataset.id)+" will be used on "+fmtShort(UI.date))}
  else if(a==="viewPlan"){UI.planView=el.dataset.id;render();$("#planView")?.scrollIntoView({block:"center"})}
  else if(a==="defPlan"){p.defaultPlanId=el.dataset.id==="calc"?null:el.dataset.id;saveState();scheduleSync();render();toast("Default plan changed")}
  else if(a==="editPlan"){const x=plansOf(p).find(y=>y.id===el.dataset.id);UI.editPlan=JSON.parse(JSON.stringify(x));render();window.scrollTo(0,0)}
  else if(a==="askDelPlan"){const x=plansOf(p).find(y=>y.id===el.dataset.id);showOverlay(`<div class="sheet"><h2>Delete "${esc(x.name)}"?</h2><p>Days that used this plan will switch to the default plan. Meals you already logged are kept.</p><div class="row"><button class="primary" data-act="doDelPlan" data-id="${x.id}" style="background:var(--bad);border-color:var(--bad)">Delete plan</button><button data-act="close">Keep it</button></div></div>`)}
  else if(a==="doDelPlan"){const id=el.dataset.id;closeOverlay();p.trainerPlans=plansOf(p).filter(x=>x.id!==id);if(p.defaultPlanId===id)p.defaultPlanId=null;if(p.planSchedule)for(const k in p.planSchedule)if(p.planSchedule[k]===id)delete p.planSchedule[k];const ov=S.planByDate?.[p.id];if(ov)for(const d in ov)if(ov[d]===id)delete ov[d];if(UI.planView===id)UI.planView=null;saveState();scheduleSync();render();toast("Plan deleted")}
  else if(a==="linkDrive"){linkDrive()}
});
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.id==="dayPick"&&t.value){UI.date=t.value;render()}
  else if(t.id==="recMeal"){UI.recMeal=t.value;UI.recOffset=0;render()}
  else if(t.id==="recDate"&&t.value){UI.date=t.value;render()}
  else if(t.id==="profileSwitch"){S.activeId=t.value;saveState();await ensureMeals(S.activeId);render()}
  else if(t.id==="importFile"&&t.files[0]){await importExcel(t.files[0]);t.value=""}
  else if(t.id==="reportFile"&&t.files[0]){const f=t.files[0];t.value="";await handleReport(f)}
  else if(t.id==="wFile"&&t.files.length){const fs=[...t.files];t.value="";await handleWorkoutFiles(fs)}
  else if(["w_loc","w_days","w_level"].includes(t.id)){const p=P();const k={w_loc:"loc",w_days:"days",w_level:"level"}[t.id];p.workout={...wSettings(p),[k]:k==="days"?+t.value:t.value};saveState();scheduleSync();UI._view=null;render()}
  else if(t.dataset&&t.dataset.tday!==undefined){const p=P();const di=+t.dataset.tday;const days=trainerPlan(p);const f=t.dataset.f;
    if(t.dataset.ti!==undefined){const it=days[di].items[+t.dataset.ti];it[f]=f==="sets"?Math.min(10,Math.max(1,+t.value||1)):t.value;if(f==="ex"&&t.value&&EX[t.value]&&(!it.name||it.name==="New exercise"))it.name=EX[t.value].name}
    else days[di][f]=t.value;
    saveState();scheduleSync();if(f==="ex"||f==="wd")render()}
  else if(t.id==="ff_photo"&&t.files[0]){const f=t.files[0];t.value="";await scanFood(f)}
  else if(t.id==="planFile"&&t.files.length){const fs=[...t.files];t.value="";await handlePlans(fs)}
  else if(t.id==="planView"){UI.planView=t.value;UI.planRecOffset=0;render()}
  else if(t.dataset&&t.dataset.kcal){editKcal(t.dataset.plan,t.dataset.kcal,t.value)}
  else if(t.id==="dayPlan"){const p=P();S.planByDate=S.planByDate||{};const m=S.planByDate[p.id]=S.planByDate[p.id]||{};if(t.value)m[UI.date]=t.value;else delete m[UI.date];saveState();render();toast("Plan for "+fmtShort(UI.date)+": "+planName(p,planChoice(p,UI.date)))}
  else if(t.dataset&&t.dataset.sch){const p=P();p.planSchedule={...(p.planSchedule||{})};if(t.value)p.planSchedule[t.dataset.sch]=t.value;else delete p.planSchedule[t.dataset.sch];saveState();scheduleSync();toast("Weekly schedule updated")}
});
document.addEventListener("submit",async ev=>{
  ev.preventDefault(); const f=ev.target;
  if(f.id==="pForm"){
    const editing=!UI.newProfile&&P();
    const d={name:$("#f_name").value.trim(),sex:$("#f_sex").value,age:+$("#f_age").value,heightCm:+$("#f_h").value,activity:$("#f_act").value,goal:$("#f_goal").value,targetWeight:$("#f_tw").value?+$("#f_tw").value:"",pref:$("#f_pref").value,trainerName:$("#f_tn").value.trim(),trainerPhone:$("#f_tp").value.trim()};
    const w=+$("#f_w").value;
    if(editing){Object.assign(editing,d,{startWeight:w});if(!(S.weights[editing.id]||[]).length){editing.weightKg=w}saveState();scheduleSync();toast("Profile saved");render()}
    else if(!UI.creating){await createProfileWithGoogle(d,w)}
  }
  else if(f.id==="tpForm"){savePlanSafe()}
  else if(f.id==="accForm"){await redeemCode($("#accCode").value)}
  else if(f.id==="genForm"){try{await adminGenerate($("#genLabel").value.trim())}catch(e){console.warn(e);toast("Couldn't create the code. Check your connection.")}}
  else if(f.id==="finishForm"){const p=P();const date=f.dataset.date;const mins=Math.round(+$("#fin_mins").value);if(!(mins>0&&mins<=600)){toast("Enter how many minutes you worked out.");return}const day=workoutFor(p,date);const inten=$("#fin_int").value;const lg=Object.assign({sets:{}},wlogOf(p,date)||{});const first=!lg.done;lg.done=true;lg.mins=mins;lg.intensity=inten;lg.kcal=burnFor(p,day?dayMet(day):5,mins,inten);lg.plan=day?day.name:"Workout";delete lg.start;wlogSet(p,date,lg);closeOverlay();render();if(first){confetti();toast(`Workout saved: ${fmtN(lg.kcal)} kcal burned`)}else toast("Workout updated")}
  else if(f.id==="actForm"){const p=P();const date=f.dataset.date;const mins=Math.round(+$("#act_m").value);if(!(mins>0)){toast("Enter the minutes.");return}const t=$("#act_t").value,inten=$("#act_i").value;const lg=Object.assign({sets:{}},wlogOf(p,date)||{});lg.acts=(lg.acts||[]).concat([{id:uid(),type:t,mins,intensity:inten,time:$("#act_time").value,kcal:burnFor(p,ACTS[t][1],mins,inten)}]);wlogSet(p,date,lg);closeOverlay();render();toast(`${ACTS[t][0]} logged`)}
  else if(f.id==="goalForm"){setGoal($("#goalIn").value)}
  else if(f.id==="waterEditForm"){const p=P();const w=allEntries(p.id).find(x=>x.id===f.dataset.id);const ml=parseFloat($("#we_ml").value);if(!(ml>0)){toast("Enter an amount in ml.");return}if(w){const nw={...w,ml:Math.round(ml),qty:Math.round(ml)+" ml",time:$("#we_time").value||w.time};removeEntry(p.id,w.id);addEntry(p.id,nw)}closeOverlay();render();toast("Water entry updated")}
  else if(f.id==="myFoodForm"){const old=f.dataset.name;const nn=$("#mf_name").value.trim();if(!nn){toast("Enter a name.");return}const v=[$("#mf_qty").value.trim()||"1 serving",parseFloat($("#mf_k").value)||0,parseFloat($("#mf_p").value)||0,parseFloat($("#mf_c").value)||0,parseFloat($("#mf_f").value)||0,$("#mf_veg").value==="1"?1:0];delete S.myFoods[old];S.myFoods[nn]=v;saveState();closeOverlay();render();toast("Saved food updated")}
  else if(f.id==="waterGoalForm"){const p=P();const v=parseFloat($("#wgoal").value);if(!(v>=0.5&&v<=8)){toast("Enter a water goal between 0.5 and 8 litres.");return}p.waterGoal=Math.round(v*1000);saveState();render();toast(`Water goal set to ${r1(v)} L`)}
  else if(f.id==="foodForm"){
    const p=P(); const m=parseFloat($("#ff_mult").value)||1; const qty=$("#ff_qty").value.trim();
    const err=t=>{const b=$("#ff_error");b.hidden=false;b.innerHTML=`<b>${esc(t)}</b>`};
    if(!$("#ff_name").value.trim()) return err("Enter what you ate.");
    if($("#ff_kcal").value===""||!(parseFloat($("#ff_kcal").value)>=0)) return err("Enter the calories, or use Look up nutrition.");
    if($("#ff_save").checked){S.myFoods=S.myFoods||{};S.myFoods[$("#ff_name").value.trim()]=[qty||"1 serving",parseFloat($("#ff_kcal").value)||0,parseFloat($("#ff_p").value)||0,parseFloat($("#ff_c").value)||0,parseFloat($("#ff_f").value)||0,$("#ff_veg").value==="1"?1:0];saveState()}
    const e={id:uid(),date:$("#ff_date").value||UI.date,time:$("#ff_time").value||timeFor($("#ff_date").value||UI.date,$("#ff_meal").value),meal:$("#ff_meal").value,name:$("#ff_name").value.trim(),qty:m===1?qty:`${m} × ${qty||"portion"}`,kcal:(parseFloat($("#ff_kcal").value)||0)*m,p:(parseFloat($("#ff_p").value)||0)*m,c:(parseFloat($("#ff_c").value)||0)*m,f:(parseFloat($("#ff_f").value)||0)*m,veg:$("#ff_veg").value==="1",source:"custom"};
    if(!e.name) return;
    if(UI.editingEntry){const old=allEntries(p.id).find(x=>x.id===UI.editingEntry); if(old){e.id=old.id;e.source=old.source;if(old.recipeId&&old.name===e.name)e.recipeId=old.recipeId;removeEntry(p.id,old.id)} UI.editingEntry=null; addEntry(p.id,e); closeOverlay(); UI.date=e.date; UI.tab="today"; render(); toast("Entry updated"); return}
    addEntry(p.id,e); closeOverlay(); UI.date=e.date; UI.tab="today"; render(); toast(`Added to ${MEALS.find(x=>x[0]===e.meal)[1]}`);
  }
  else if(f.id==="wForm"){
    const p=P(); const date=$("#wDate").value||today(); const kg=+$("#wKg").value; if(!kg) return;
    const arr=(S.weights[p.id]||[]).filter(w=>w.date!==date); arr.push({date,kg}); S.weights[p.id]=arr; saveState(); scheduleSync(); render(); toast("Weight logged. Diet chart updated.");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOverlay()});

/* ============ Boot ============ */
async function bootApp(){
  let acc0="fresh"; try{acc0=localStorage.getItem("pp_accent")||acc0}catch(e){} setAccent(acc0);
  /* remove copies an earlier version kept in this browser; the account store is the only place data lives now */
  try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k==="pp_state"||k.startsWith("pp_meals_")))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(e){}
  if(!(await initStore())) return;
  if(S.activeId&&!S.profiles.some(p=>p.id===S.activeId)) S.activeId=S.profiles[0]?.id||null;
  /* older single-plan profiles become the first entry in the plan list */
  let migrated=false; for(const p of S.profiles){ if(p.trainerPlan){const t=p.trainerPlan;const id=uid();p.trainerPlans=(p.trainerPlans||[]).concat([{...t,id,name:t.name||"Trainer's plan",type:t.type||"mixed"}]);if(t.active)p.defaultPlanId=id;delete p.trainerPlan;delete p.trainerPlans[p.trainerPlans.length-1].active;migrated=true} }
  if(migrated) saveState();
  if(S.activeId) await ensureMeals(S.activeId).catch(()=>{MEAL_DOCS[S.activeId]={}});
  UI.tab=S.profiles.length?"today":"profile";
  let acc=S.accent; try{acc=localStorage.getItem("pp_accent")||acc}catch(e){} setAccent(acc);
  render();
  if(UI.migrated) setTimeout(()=>toast("Your data has moved to your Google Drive and was removed from Claude's storage."),600);
  if(window.claude&&claude.use){ claude.use("sample").then(async s=>{sampleFn=s; if(s){UI.limits=await s.limits().catch(()=>null); if(["recipes","plan","profile"].includes(UI.tab)&&!UI.creating)render()}}).catch(()=>{}) }
}
bootApp();
</script>
